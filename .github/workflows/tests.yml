name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    # Pinned to PHP 8.2 to match composer.json ("php": "^8.2") and the
    # Laravel 10.44.0 target — this project intentionally does not test
    # against other PHP versions or Laravel 11/12.
    name: PHP 8.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        # phpunit.xml overrides DB_CONNECTION to an in-memory SQLite
        # database, so the Dockerized MySQL from docker-compose.yml isn't
        # needed here.
        run: vendor/bin/phpunit
